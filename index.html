<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCAI4S · PolyU</title>
<meta name="description" content="Research Centre on AI for Science (RCAI4S), PolyU Academy for Artificial Intelligence, The Hong Kong Polytechnic University. Using tokens to light up science.">
<style>
:root{
  --charcoal:#1C1E2B; --paper:#FFFFFF; --faint:#99A0B6;
  --sky:#82C4E2; --blue:#2F4AB8; --violet:#A073D5; --mint:#62C4AB;
  --stripe:linear-gradient(90deg,var(--sky),var(--blue) 36%,var(--violet) 66%,var(--mint));
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--charcoal);color:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.stripe{height:6px;background:var(--stripe)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:48px 16px;max-width:880px;width:100%;margin:0 auto}
.sm{font-size:15px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
h1{font-size:clamp(34px,6vw,60px);line-height:1.12;font-weight:700;margin:20px 0 24px}
h1 .hi{color:var(--violet)}
.md{font-size:clamp(20px,3vw,28px);color:var(--sky)}
nav{margin-top:56px;display:flex;flex-wrap:wrap;gap:12px 28px;font-size:17px}
a{color:var(--paper);text-decoration:none;border-bottom:1px solid var(--faint)}
a:hover{border-color:var(--mint);color:var(--mint)}
footer{padding:24px 16px;text-align:center;font-size:13px;color:var(--faint)}
</style>
</head>
<body>
<div class="stripe"></div>
<main>
  <p class="sm">PAAI · The Hong Kong Polytechnic University</p>
  <h1>Research Centre on<br>AI for Science (<span class="hi">RCAI4S</span>)</h1>
  <p class="md">Using tokens to light up science.</p>
  <nav>
    <a href="https://jessielzh.com">Prof. Jessie Li</a>
  </nav>
</main>
<footer>© 2026 RCAI4S · PolyU Academy for Artificial Intelligence</footer>
</body>
</html>
