<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCAI4S · PolyU</title>
<meta name="description" content="Research Centre on AI for Science (RCAI4S), PolyU Academy for Artificial Intelligence, The Hong Kong Polytechnic University. Using tokens to light up science.">
<link rel="stylesheet" href="style.css">
<style>
.cta{margin-top:48px}
/* the button flips (top to bottom, like a split-flap) to say how the question is answered */
.ask{display:inline-block;border:0;perspective:600px;color:#fff}
.ask:hover{color:#fff}
.flip{display:grid;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.face{grid-area:1/1;display:flex;align-items:center;justify-content:center;white-space:nowrap;
  padding:15px 36px;border-radius:999px;font-size:18px;font-weight:600;letter-spacing:.01em;backface-visibility:hidden}
.front{background:linear-gradient(100deg,var(--blue),var(--violet));box-shadow:0 10px 34px rgba(160,115,213,.28)}
.back{background:linear-gradient(100deg,var(--violet),var(--sky));color:var(--charcoal);transform:rotateX(180deg);
  box-shadow:0 10px 34px rgba(130,196,226,.32)}
.ask:hover .flip,.ask:focus-visible .flip{transform:rotateX(180deg)}
.cta .note{display:none;margin-top:12px;font-size:15px;color:var(--faint)}
@media (hover:none){.cta .note{display:block}}

/* the showcase: a small window onto the report, its caption beside it */
.case{margin-top:44px;display:flex;align-items:center;gap:20px 40px;flex-wrap:wrap}
.window{position:relative;display:block;flex:none;width:420px;max-width:100%;height:250px;border:0;border-radius:12px;overflow:hidden;background:#111;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 16px 40px rgba(0,0,0,.35)}
.window:hover{box-shadow:0 0 0 2px var(--sky),0 16px 40px rgba(0,0,0,.35)}
.reel{position:absolute;left:0;top:0;width:1100px;transform-origin:0 0;will-change:transform}
.reel iframe{display:block;width:1100px;height:9000px;border:0;pointer-events:none}
.case figcaption{flex:1 1 260px;min-width:0;max-width:420px}
.case .k{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.case figcaption p{margin-top:8px;font-size:17px;color:var(--text)}
.case figcaption a{display:inline-block;margin-top:14px;font-size:15px}

.why{margin-top:40px;font-size:clamp(22px,3vw,28px);color:var(--text)}
.why a{border:0;color:var(--paper);text-decoration:underline;text-decoration-color:var(--violet);
  text-decoration-thickness:2px;text-underline-offset:6px}
.why a:hover{color:var(--violet);text-decoration-color:var(--violet)}

@media (max-width:520px){main{padding-top:40px}.cta{margin-top:40px}.ask,.face{display:block;text-align:center}
  .case{margin-top:56px}.window{width:100%;height:340px}.why{margin-top:56px}}

/* desktop: one column as before, just wider; the caption stays on one line */
@media (min-width:960px){
  main{max-width:1120px;padding:44px 40px 32px}
  h1{font-size:clamp(36px,4.2vw,50px);white-space:nowrap}
  h1 .narrow{display:none}
}
</style>
</head>
<body>
<div class="stripe"></div>
<main>
  <p class="sm">PAAI · The Hong Kong Polytechnic University</p>
  <h1>Research Centre on<br class="narrow"> AI for Science (<span class="hi">RCAI4S</span>)</h1>
  <p class="md">Using tokens to light up science.</p>


  <figure class="case">
    <a class="window" href="case/" aria-label="Open the case report">
      <div class="reel" id="reel"><iframe id="report" src="case/index.html" title="A case report" tabindex="-1" loading="lazy"></iframe></div>
    </a>
    <figcaption>
      <p class="k">A showcase</p>
      <p>The report generated by an AI agent within an hour from a question provided by Prof. Jiong Zhao.</p>
      <a href="case/">Read the report</a>
    </figcaption>
  </figure>

  <div class="cta">
    <a class="ask" href="ask.html"><span class="flip"><span class="face front">Ask a question</span><span class="face back">Our AI agents take it on</span></span></a>
    <p class="note">Our AI agents take it on.</p>
  </div>

  <p class="why"><a href="https://jessielzh.com/talks/2026-10-paai-salon/">Why</a> we are establishing this Centre.</p>
</main>
<footer>© 2026 RCAI4S · PAAI · PolyU · Contact: <a href="https://jessielzh.com">Prof. Jessie Li</a></footer>
<script>
// a window onto the report: scale it to the frame and let it drift down slowly, then start over
(() => {
  const win = document.querySelector('.window'), reel = document.getElementById('reel'), fr = document.getElementById('report');
  const SPEED = 45;                            // report px per second
  const W = win.clientWidth < 700 ? 720 : 1100;   // a small window renders the report narrower so its text stays legible
  reel.style.width = fr.style.width = W + 'px';
  let H = 9000, y = 0, last = 0, pause = 1500;
  const scale = () => win.clientWidth / W;
  const draw = () => reel.style.transform = `scale(${scale()}) translateY(${-y}px)`;
  fr.addEventListener('load', () => {
    try { H = fr.contentDocument.documentElement.scrollHeight; fr.style.height = H + 'px'; } catch (e) {}  // file:// keeps 9000
  });
  addEventListener('resize', draw); draw();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function tick(t) {
    const dt = last ? (t - last) / 1000 : 0; last = t;
    if (pause > 0) pause -= dt * 1000;
    else {
      y += SPEED * dt;
      const end = H - win.clientHeight / scale();
      if (y >= end) { y = end; pause = 2500; setTimeout(() => { y = 0; pause = 1500; draw(); }, 2400); }
    }
    draw(); requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
